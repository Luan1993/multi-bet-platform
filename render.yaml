services:
  - type: web
    name: multi-bet
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node scripts/deploy-start.cjs
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DEMO_MODE
        value: "false"
      - key: ODDS_PROVIDER
        value: the-odds-api
      - key: THE_ODDS_API_CACHE_MINUTES
        value: "540"
      - key: ODDS_STALE_MINUTES
        value: "600"
      # Informe no painel do Render (o plano grátis tem 500 créditos/mês).
      - key: THE_ODDS_API_KEY
        sync: false
      # Segredos gerados pelo Render. Veja os valores no painel do serviço.
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: SELLER01_PASSWORD
        generateValue: true
      - key: SELLER02_PASSWORD
        generateValue: true
      # PostgreSQL externo gratuito (Neon/Supabase/Aiven).
      # No Blueprint, o Render pede este valor na criação do serviço.
      # Formato: postgresql://user:senha@host:5432/banco?sslmode=require
      - key: DATABASE_URL
        sync: false
